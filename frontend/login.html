<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — SmartStore</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{font-family:'Inter',sans-serif;box-sizing:border-box}
body{background:linear-gradient(135deg,#eef1f6 0%,#e0e7ff 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0;padding:20px}
.login-card{width:100%;max-width:440px;background:#fff;border-radius:24px;padding:40px 36px;box-shadow:0 24px 60px rgba(15,23,42,.12)}
.brand-logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#4a6cf7,#8b93ff);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.5rem;margin:0 auto 18px}
.login-card h2{font-weight:800;font-size:1.6rem;color:#0f172a;text-align:center;margin-bottom:6px}
.login-card p.sub{text-align:center;color:#64748b;font-size:.88rem;margin-bottom:28px}
.field-label{font-weight:700;font-size:.85rem;color:#0f172a;margin-bottom:8px;display:block}
.field{width:100%;padding:13px 18px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:.95rem;outline:none;background:#fff;color:#0f172a;margin-bottom:18px}
.field:focus{border-color:#4a6cf7;box-shadow:0 0 0 3px rgba(74,108,247,.12)}
.field::placeholder{color:#94a3b8}
.pwd-wrap{position:relative}
.pwd-wrap .field{padding-right:48px}
.pwd-toggle{position:absolute;right:16px;top:16px;color:#94a3b8;cursor:pointer;font-size:.95rem}
.btn-login{width:100%;background:linear-gradient(135deg,#4a6cf7,#3b5bea);color:#fff;border:none;padding:14px 0;border-radius:12px;font-weight:700;font-size:.95rem;cursor:pointer;transition:.15s;margin-top:6px}
.btn-login:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-login:disabled{opacity:.6;cursor:not-allowed;transform:none}
.err{background:#fef2f2;color:#dc2626;padding:11px 16px;border-radius:10px;font-size:.83rem;font-weight:600;margin-bottom:16px;display:none;border:1px solid #fecaca}
.err.show{display:block}
.link-row{text-align:center;font-size:.85rem;color:#64748b;margin-top:22px}
.link-row a{color:#4a6cf7;font-weight:700;text-decoration:none}
.link-row a:hover{text-decoration:underline}
.role-hint{margin-top:14px;text-align:center;font-size:.72rem;color:#94a3b8;line-height:1.6}
</style>
</head>
<body>

<div class="login-card">
  <div class="brand-logo"><i class="bi bi-bag-check-fill"></i></div>
  <h2>Welcome Back</h2>
  <p class="sub">Sign in to your SmartStore account</p>

  <div class="err" id="errBox"></div>

  <form id="loginForm" onsubmit="handleLogin(event)" autocomplete="off" novalidate>
    <label class="field-label">Username or Email</label>
    <input type="text" class="field" id="loginUser" placeholder="Enter username or email" autocomplete="username" autofocus>

    <label class="field-label">Password</label>
    <div class="pwd-wrap">
      <input type="password" class="field" id="loginPass" placeholder="Enter password" autocomplete="current-password">
      <i class="bi bi-eye pwd-toggle" id="pwdToggle" onclick="togglePwd()"></i>
    </div>

    <button type="submit" class="btn-login" id="loginBtn">
      <i class="bi bi-box-arrow-in-right me-2"></i> Sign In
    </button>
  </form>

  <div class="link-row">New merchant? <a href="register.html">Create an account</a></div>

  <div class="role-hint">
    Merchant · Manager · Sales Man supported<br>
    Staff credentials are created by the Merchant
  </div>
</div>

<script>
/* ============================================================
   Helpers
   ============================================================ */
const $ = id => document.getElementById(id);
const readLS  = (k, fb) => { try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? fb : v; } catch (e) { return fb; } };
const writeLS = (k, v)  => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };
const rmLS    = (k)     => { try { localStorage.removeItem(k); } catch (e) {} };

function normalizeRole(r) {
  return String(r || '').toLowerCase().replace(/\s+/g, ' ').trim();
}

function showErr(msg) { const e = $('errBox'); e.textContent = msg; e.classList.add('show'); }
function hideErr()    { $('errBox').classList.remove('show'); }
function togglePwd() {
  const f = $('loginPass');
  const t = $('pwdToggle');
  if (f.type === 'password') { f.type = 'text';   t.classList.replace('bi-eye','bi-eye-slash'); }
  else                       { f.type = 'password'; t.classList.replace('bi-eye-slash','bi-eye'); }
}

/* ============================================================
   SAFE REDIRECT
   ============================================================ */
function safeRedirect(url) {
  const btn = $('loginBtn');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<i class="bi bi-arrow-repeat me-2"></i> Signing in…';
  }
  console.log('[Login] Redirecting to:', url);

  setTimeout(() => {
    try {
      if (window.top && window.top !== window.self) {
        window.top.location.replace(url);
      } else {
        window.location.replace(url);
      }
    } catch (e1) {
      console.warn('[Login] Top-level blocked, trying same-window', e1);
      try { window.location.replace(url); } catch (e2) {}
    }

    setTimeout(() => {
      if (document.visibilityState === 'visible' && !document.hidden) {
        const errBox = $('errBox');
        if (errBox) {
          errBox.innerHTML =
            '⚠️ Redirect blocked by preview sandbox.<br>' +
            '<a href="' + url + '" style="color:#dc2626;text-decoration:underline;font-weight:700">' +
            '→ Click here to open the page manually</a>';
          errBox.classList.add('show');
        }
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i> Sign In';
        }
      }
    }, 900);
  }, 200);
}

/* ============================================================
   SUPER ADMIN
   ============================================================ */
const SUPER_ADMIN = {
  username: 'superadmin',
  password: 'admin123',
  name: 'SmartStore Admin',
  email: 'admin@smartstore.com'
};

/* ============================================================
   AUTH — MERCHANT
   ============================================================ */
function findMerchant(username, password) {
  const uLower = String(username).toLowerCase();
  for (const key of ['registeredUsers', 'smartstore_users']) {
    const list = readLS(key, []);
    if (!Array.isArray(list)) continue;
    const found = list.find(u => {
      const role = String(u.role || 'merchant').toLowerCase();
      if (role !== 'merchant') return false;
      const uName  = String(u.username || '').toLowerCase();
      const uEmail = String(u.email    || '').toLowerCase();
      const matchesUser = (uName === uLower) || (uEmail === uLower);
      const matchesPass = (u.password === password) || (u.passwordHash && u.passwordHash === password);
      return matchesUser && matchesPass;
    });
    if (found) return found;
  }
  return null;
}

/* ============================================================
   AUTH — STAFF
   ============================================================ */
function findStaff(username, password) {
  const uLower = String(username).toLowerCase();
  const list = readLS('smartstore_staff', []);
  console.log('[Login] Staff pool size:', Array.isArray(list) ? list.length : 0);
  if (!Array.isArray(list)) return null;
  const found = list.find(s => {
    if (!s || typeof s !== 'object') return false;
    const nameMatch = String(s.username || '').toLowerCase() === uLower;
    if (!nameMatch) return false;
    const passMatch =
      (s.password && s.password === password) ||
      (s.passwordHash && s.passwordHash === password);
    return !!passMatch;
  }) || null;
  console.log('[Login] Staff lookup for', username, '→', found ? ('found, role=' + found.role) : 'NOT FOUND');
  return found;
}

/* ============================================================
   LOGIN — SUPER ADMIN
   ============================================================ */
function loginAsSuperAdmin() {
  rmLS('smartstore_staff_session');
  localStorage.setItem('loggedInUser', SUPER_ADMIN.username);
  localStorage.setItem('role', 'superadmin');
  writeLS('user', {
    username: SUPER_ADMIN.username,
    role:     'superadmin',
    name:     SUPER_ADMIN.name,
    email:    SUPER_ADMIN.email
  });
  localStorage.setItem('token', 'mock-superadmin-token-' + Date.now());
  safeRedirect('superadmin.html');
}

/* ============================================================
   LOGIN — MERCHANT
   ============================================================ */
function loginAsMerchant(merchant) {
  const usernameForUrl = merchant.username || merchant.email || '';
  if (!usernameForUrl) { showErr('Merchant account is missing a username.'); return; }

  rmLS('smartstore_staff_session');
  writeLS('user', merchant);
  writeLS('smartstore_current_user', merchant);
  localStorage.setItem('loggedInUser', usernameForUrl);
  localStorage.setItem('token', merchant.token || ('mock-merchant-token-' + Date.now()));
  localStorage.removeItem('role');

  safeRedirect('dashboard.html?merchant=' + encodeURIComponent(usernameForUrl));
}

/* ============================================================
   LOGIN — STAFF
   Sales Man → pos.html
   Manager   → merchant.html
   ============================================================ */
function loginAsStaff(staff) {
  const role = staff.role || 'Sales Man';
  const roleKey = normalizeRole(role);

  let brandName = '';
  for (const k of ['registeredUsers', 'smartstore_users']) {
    const list = readLS(k, []);
    if (!Array.isArray(list)) continue;
    const m = list.find(u => {
      const r = String(u.role || 'merchant').toLowerCase();
      return r === 'merchant' &&
        String(u.storeSlug || '').toLowerCase() === String(staff.storeSlug || '').toLowerCase();
    });
    if (m) { brandName = m.brandName || m.username || ''; break; }
  }

  const staffSession = {
    staffId:    staff.id,
    username:   staff.username,
    role:       role,
    storeSlug:  staff.storeSlug || '',
    merchantId: staff.merchantId || staff.storeSlug || '',
    userType:   'staff',
    loggedInAt: new Date().toISOString()
  };
  writeLS('smartstore_staff_session', staffSession);
  writeLS('user', {
    username:  staff.username,
    role:      role,
    storeSlug: staff.storeSlug || '',
    userType:  'staff',
    brandName: brandName
  });
  localStorage.setItem('loggedInUser', staff.username);
  localStorage.setItem('token', 'mock-staff-token-' + Date.now());
  rmLS('smartstore_current_user');
  localStorage.removeItem('role');

  let target = 'pos.html';
  if (roleKey === 'manager')         target = 'merchant.html';
  else if (roleKey === 'sales man')  target = 'pos.html';

  console.log('[Login] Staff role =', role, '→ target =', target);
  safeRedirect(target);
}

/* ============================================================
   MAIN LOGIN HANDLER
   ============================================================ */
function handleLogin(e) {
  e.preventDefault();
  hideErr();

  const username = $('loginUser').value.trim();
  const password = $('loginPass').value.trim();

  console.log('[Login] Attempting login for:', username);

  if (!username || !password) { showErr('Please enter username and password.'); return; }

  /* PRIORITY 1: SUPER ADMIN */
  if (username === SUPER_ADMIN.username && password === SUPER_ADMIN.password) {
    console.log('✅ Super Admin credentials detected');
    loginAsSuperAdmin();
    return;
  }

  /* PRIORITY 2: Staff (Sales Man / Manager) */
  const staff = findStaff(username, password);
  if (staff) {
    const roleKey = normalizeRole(staff.role);
    console.log('[Login] Staff matched — roleKey =', roleKey);
    if (roleKey === 'sales man' || roleKey === 'manager') {
      loginAsStaff(staff);
      return;
    }
  }

  /* PRIORITY 3: Merchant */
  const merchant = findMerchant(username, password);
  if (merchant) { loginAsMerchant(merchant); return; }

  /* PRIORITY 4: Any other staff role */
  if (staff) { loginAsStaff(staff); return; }

  /* None matched */
  console.warn('[Login] No match for', username);
  showErr('Invalid username or password.');
  $('loginPass').focus();
  $('loginPass').select();
}
</script>
</body>
</html>
