<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POS System — SmartStore</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{font-family:'Inter',sans-serif;box-sizing:border-box}
:root{--brand:#4a6cf7;--bg:#eef1f6;--ink:#0f172a}
body{background:var(--bg);min-height:100vh;padding:16px}
.pos-header{background:#fff;border-radius:18px;padding:14px 20px;box-shadow:0 2px 10px rgba(15,23,42,.04);display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.pos-card{background:#fff;border:1px solid #eef1f6;border-radius:14px;overflow:hidden;cursor:pointer;transition:.15s}
.pos-card:hover{transform:translateY(-3px);border-color:#c7d0fb;box-shadow:0 6px 16px rgba(15,23,42,.06)}
.pos-card.out{opacity:.4;cursor:not-allowed}
.pos-card img{width:100%;height:105px;object-fit:cover;background:#f8fafc}
.pos-card .pos-info{padding:8px 10px}
.pos-name{font-weight:700;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos-chip{border:1px solid #e2e8f0;background:#fff;border-radius:50px;padding:4px 14px;font-size:.78rem;font-weight:600;color:#475569;cursor:pointer}
.pos-chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.bill-box{background:#fff;border-radius:18px;padding:20px;box-shadow:0 2px 10px rgba(15,23,42,.04);position:sticky;top:16px}
.bill-row{display:flex;align-items:center;gap:10px;border-bottom:1px solid #f4f6fb;padding:8px 0}
.bill-row img{width:38px;height:38px;border-radius:8px;object-fit:cover}
.qty-btn{width:24px;height:24px;border:1px solid #cbd5e1;background:#fff;border-radius:6px;cursor:pointer;line-height:1}
.toast-x{position:fixed;bottom:20px;right:20px;background:#10b981;color:#fff;padding:12px 24px;border-radius:10px;z-index:9999;font-weight:600}
</style>
</head>
<body>

<div class="pos-header">
  <div class="d-flex align-items-center gap-2">
    <div style="width:34px;height:34px;background:var(--brand);color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center"><i class="bi bi-calculator"></i></div>
    <h5 class="fw-bold mb-0">POS Terminal</h5>
    <span class="badge bg-light text-dark border ms-2" id="posUserBadge">Staff</span>
  </div>
  <button class="btn btn-sm btn-outline-danger" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Log out</button>
</div>

<div class="row g-3">
  <div class="col-lg-8">
    <div class="d-flex justify-content-between align-items-center gap-2 mb-3">
      <input id="posSearch" class="form-control" style="max-width:280px" placeholder="Search product / SKU..." oninput="renderPos()">
      <div id="posCats" class="d-flex gap-2 flex-wrap"></div>
    </div>
    <div id="posGrid" class="pos-grid"></div>
  </div>

  <div class="col-lg-4">
    <div class="bill-box">
      <h5 class="fw-bold mb-3"><i class="bi bi-receipt me-2"></i>Current Bill</h5>
      <div id="posBill" style="max-height:380px;overflow-y:auto"></div>
      <div class="border-top pt-3 mt-3">
        <div class="d-flex justify-content-between fw-bold fs-5 mb-3">
          <span>Total</span>
          <span id="posTotal">₹0</span>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-light flex-fill" onclick="posClear()">Clear</button>
          <button class="btn btn-success flex-fill" onclick="posCheckout()">Complete Sale</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const DEFAULT_IMG = 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=200&auto=format&fit=crop&q=80';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const getMe = () => { try { return JSON.parse(localStorage.getItem('user') || '{}'); } catch(e){ return {}; } };
const getList = k => { try { return JSON.parse(localStorage.getItem(k) || '[]'); } catch(e){ return []; } };
const setList = (k, v) => localStorage.setItem(k, JSON.stringify(v));

let posBill = [], posCat = 'all';

function toast(msg) {
  const old = document.querySelector('.toast-x'); if (old) old.remove();
  const t = document.createElement('div'); t.className = 'toast-x'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2000);
}
document.addEventListener('DOMContentLoaded', () => {
  const loggedIn = localStorage.getItem('loggedInUser');
  const me = JSON.parse(localStorage.getItem('user') || '{}');

  if (!loggedIn) {
    location.href = 'login.html';
    return;
  }

  // Show logged in cashier username
  const userTag = document.getElementById('posUserBadge');
  if (userTag) userTag.textContent = me.username;
});

function logout() {
  localStorage.removeItem('loggedInUser');
  localStorage.removeItem('user');
  location.href = 'login.html';
}
function posSetCat(c) { posCat = c; renderPos(); }

function renderPos() {
  const all = getList('smartstore_products');
  const q = (document.getElementById('posSearch').value || '').toLowerCase();
  const cats = ['all', ...new Set(all.map(p => p.category).filter(Boolean))];

  document.getElementById('posCats').innerHTML = cats.map(c =>
    `<button class="pos-chip ${c === posCat ? 'on' : ''}" onclick="posSetCat('${esc(c)}')">${c === 'all' ? 'All' : esc(c)}</button>`
  ).join('');

  const list = all.filter(p => (posCat === 'all' || p.category === posCat) && (p.name || '').toLowerCase().includes(q));
  document.getElementById('posGrid').innerHTML = list.length ? list.map(p => `
    <div class="pos-card ${p.stock <= 0 ? 'out' : ''}" onclick="posAdd(${p.id})">
      <img src="${esc(p.image || DEFAULT_IMG)}" alt="">
      <div class="pos-info">
        <div class="pos-name">${esc(p.name)}</div>
        <div class="d-flex justify-content-between align-items-center mt-1">
          <b>₹${esc(p.price)}</b>
          <span class="small text-secondary">Qty: ${esc(p.stock)}</span>
        </div>
      </div>
    </div>`).join('') : '<p class="text-secondary p-3">No products available.</p>';

  renderBill();
}

function posAdd(id) {
  const p = getList('smartstore_products').find(x => x.id === id);
  if (!p || p.stock <= 0) { toast('⚠️ Out of stock'); return; }
  const line = posBill.find(x => x.id === id);
  if ((line ? line.qty : 0) + 1 > p.stock) { toast('⚠️ Stock limit reached'); return; }
  line ? line.qty++ : posBill.push({ id: p.id, name: p.name, price: p.price, image: p.image, qty: 1 });
  renderBill();
}

function posQty(id, delta) {
  const line = posBill.find(x => x.id === id); if (!line) return;
  const p = getList('smartstore_products').find(x => x.id === id);
  if (delta > 0 && p && line.qty + 1 > p.stock) { toast('⚠️ Stock limit reached'); return; }
  line.qty += delta;
  if (line.qty <= 0) posBill = posBill.filter(x => x.id !== id);
  renderBill();
}

function posClear() { posBill = []; renderBill(); }

function renderBill() {
  document.getElementById('posBill').innerHTML = posBill.length ? posBill.map(b => `
    <div class="bill-row">
      <img src="${esc(b.image || DEFAULT_IMG)}" alt="">
      <div style="flex:1;min-width:0">
        <div class="pos-name">${esc(b.name)}</div>
        <div class="small text-secondary">₹${esc(b.price)}</div>
      </div>
      <button class="qty-btn" onclick="posQty(${b.id},-1)">-</button>
      <b>${b.qty}</b>
      <button class="qty-btn" onclick="posQty(${b.id},1)">+</button>
      <b style="width:65px;text-align:right">₹${b.price * b.qty}</b>
    </div>`).join('') : '<p class="text-secondary text-center py-4 mb-0">No items selected.</p>';

  document.getElementById('posTotal').textContent = '₹' + posBill.reduce((s, b) => s + b.price * b.qty, 0);
}

function posCheckout() {
  if (!posBill.length) { toast('⚠️ Bill is empty'); return; }
  const all = getList('smartstore_products');
  posBill.forEach(b => {
    const p = all.find(x => x.id === b.id);
    if (p) p.stock = Math.max(0, p.stock - b.qty);
  });
  const orders = getList('smartstore_orders');
  const total = posBill.reduce((s, b) => s + b.price * b.qty, 0);
  orders.push({
    id: Date.now(),
    items: [...posBill],
    total,
    status: 'Delivered',
    paymentStatus: 'Paid',
    customerName: 'POS Counter Sale',
    createdAt: new Date().toLocaleString()
  });

  setList('smartstore_products', all);
  setList('smartstore_orders', orders);
  posBill = [];
  renderPos();
  toast('✅ Sale done: ₹' + total);
}

function logout() {
  localStorage.removeItem('loggedInUser');
  localStorage.removeItem('user');
  location.href = 'login.html';
}
</script>
</body>
</html>
